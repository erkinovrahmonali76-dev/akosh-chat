
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akosh Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d18;
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .app {
      width: min(440px, 92%);
      padding: 32px 24px;
      border: 1px solid #24334e;
      border-radius: 24px;
      background: #101a2c;
      text-align: center;
      box-shadow: 0 20px 70px #0007;
    }
    .logo {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 24px;
      background: linear-gradient(135deg, #1686ff, #1648d8);
      font-size: 34px;
      font-weight: bold;
    }
    h1 { margin: 0 0 10px; }
    p { color: #a9b8d0; line-height: 1.6; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      background: #1877f2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #0864df; }
    .status { font-size: 12px; color: #7f91ad; }
  </style>
</head>
<body>
  <main class="app">
    <div class="logo">A</div>
    <h1>Akosh Chat</h1>
    <p>Do‘stlaring bilan suhbatlash. Guruhlar yarat va xabar almash.</p>
    <button id="start">Chatni boshlash</button>
    <p class="status" id="status">PRO versiya · Dastlabki sahifa</p>
  </main>
  <script>
    document.getElementById("start").addEventListener("click", () => {
      document.getElementById("status").textContent =
        "Keyingi bosqichda telefon orqali kirish ulanadi.";
    });
  </script>
</body>
</html>
