
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AKOSH CHAT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080d18;--panel:#101a2b;--panel2:#17243a;--blue:#2678ff;--text:#f4f7ff;--muted:#9cabc4;--line:#253550}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}
button,input{font:inherit}
button{border:0;cursor:pointer;border-radius:10px;padding:11px 14px;background:var(--blue);color:white;font-weight:600}
input{width:100%;background:#0b1423;color:white;border:1px solid var(--line);padding:12px;border-radius:10px}
.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}
.brand{font-size:24px;font-weight:900}.brand span{color:#4b91ff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px}
.stack{display:grid;gap:12px}.row{display:flex;align-items:center;gap:10px;min-width:0}
.auth{max-width:420px;margin:8vh auto;padding:20px}
.switch{display:flex;gap:8px;margin-bottom:16px}.switch button{flex:1;background:var(--panel2)}
.switch .active{background:var(--blue)}
#app{max-width:1200px;margin:auto;min-height:100vh;display:grid;grid-template-columns:330px 1fr}
.sidebar{padding:18px;border-right:1px solid var(--line);min-width:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:100vh}
.top{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.section{margin-top:20px}.avatar{width:44px;height:44px;object-fit:cover;border-radius:50%;background:var(--panel2);flex-shrink:0}
.useritem{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;margin-top:5px;cursor:pointer}
.useritem:hover,.useritem.selected{background:var(--panel2)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.storybar{display:flex;gap:12px;overflow:auto;padding:12px 0}
.story{min-width:65px;text-align:center;cursor:pointer}
.story .avatar{border:2px solid #448cff;padding:2px}
.story small{display:block;margin-top:5px;max-width:70px;overflow:hidden;text-overflow:ellipsis}
.content{padding:18px;flex:1;overflow:auto}
.empty{text-align:center;color:var(--muted);margin:auto;padding:35px}
.messages{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:80%;background:var(--panel2);padding:11px 14px;border-radius:14px;align-self:flex-start;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:#155bc6}
.bubble time{display:block;font-size:10px;opacity:.7;margin-top:5px}
.composer{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0}.smallbtn{padding:8px 10px;font-size:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#203451;padding:12px 18px;border-radius:12px;z-index:10;max-width:90%;display:none}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:5}
.modal .card{width:min(500px,100%);max-height:85vh;overflow:auto}
#storyMedia img,#storyMedia video{width:100%;max-height:60vh;object-fit:contain}
@media(max-width:700px){#app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.main{min-height:60vh}.auth{margin:4vh auto;padding:14px}}
</style>
</head>
<body>
<section id="auth" class="auth">
  <div class="brand">AKOSH <span>CHAT</span></div>
  <p class="muted">Do‘stlaringiz bilan bog‘laning.</p>
  <div class="card">
    <div class="switch">
      <button id="loginTab" class="active" onclick="setMode('login')">Kirish</button>
      <button id="signupTab" onclick="setMode('signup')">Ro‘yxatdan o‘tish</button>
    </div>
    <form id="authForm" class="stack">
      <div id="nameField" class="hidden">
        <label>Ism</label><input id="displayName" maxlength="40" placeholder="Ismingiz">
      </div>
      <div id="usernameField" class="hidden">
        <label>Username</label><input id="username" maxlength="24" placeholder="akosh_user">
      </div>
      <div><label>Email</label><input id="email" type="email" required placeholder="email@example.com"></div>
      <div><label>Parol</label><input id="password" type="password" minlength="8" required placeholder="Kamida 8 belgi"></div>
      <button id="authSubmit">Kirish</button>
    </form>
  </div>
</section>

<div id="app" class="hidden">
 <aside class="sidebar">
  <div class="row" style="justify-content:space-between">
    <div class="brand">AKOSH <span>CHAT</span></div>
    <button class="smallbtn" onclick="logout()">Chiqish</button>
  </div>

  <div class="section card">
    <div class="row">
      <img id="myAvatar" class="avatar" alt="Profil rasmi">
      <div><strong id="myName"></strong><div id="myUsername" class="muted"></div></div>
    </div>
    <div class="stack" style="margin-top:14px">
      <label class="muted">Profil rasmi</label>
      <input id="avatarFile" type="file" accept="image/*">
      <button onclick="uploadAvatar()">Rasmni saqlash</button>
      <button onclick="editProfile()" style="background:var(--panel2)">Profilni tahrirlash</button>
    </div>
  </div>

  <div class="section">
    <strong>Stories · 24 soat</strong>
    <div class="stack" style="margin-top:10px">
      <input id="storyFile" type="file" accept="image/*,video/*">
      <button onclick="uploadStory()">+ Story joylash</button>
    </div>
    <div id="stories" class="storybar"></div>
  </div>

  <div class="section">
    <strong>Username orqali qidirish</strong>
    <div class="row" style="margin-top:10px">
      <input id="searchInput" placeholder="@username">
      <button onclick="searchUsers()">Topish</button>
    </div>
    <div id="searchResults"></div>
  </div>

  <div class="section">
    <strong>Suhbatlar</strong>
    <div id="chatList" class="muted">Suhbatlar yuklanmoqda…</div>
  </div>
 </aside>

 <main class="main">
  <header class="top">
    <div><strong id="chatTitle">AKOSH CHAT</strong><div id="chatSub" class="muted">Foydalanuvchini qidiring</div></div>
    <button class="smallbtn" onclick="refreshAll()">Yangilash</button>
  </header>
  <div id="content" class="content">
    <div class="empty"><h2>AKOSH CHAT</h2>Username orqali do‘st toping va suhbat boshlang.</div>
  </div>
  <form id="composer" class="composer hidden">
    <input id="messageInput" maxlength="4000" placeholder="Xabar yozing…">
    <button type="submit">Yuborish</button>
  </form>
 </main>
</div>

<div id="storyViewer" class="modal hidden">
 <div class="card stack">
  <div class="row" style="justify-content:space-between">
   <strong id="storyTitle">Story</strong><button onclick="closeStory()">Yopish</button>
  </div>
  <div id="storyMedia"></div><div id="storyOwner" class="muted"></div>
 </div>
</div>
<div id="toast"></div>

<script>
const SUPABASE_URL = "https://bynjgrrwlbqqyxohnlpm.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wnt7_3ggyJvDtWxBlFeOTw_PywBtAl7";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentUser=null,profile=null,activeChat=null,partner=null,timer=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=s=>(s||"?").slice(0,2).toUpperCase();

function toast(s){
  $("toast").textContent=s;$("toast").style.display="block";
  setTimeout(()=>$("toast").style.display="none",3500);
}
function setMode(m){
  $("loginTab").classList.toggle("active",m==="login");
  $("signupTab").classList.toggle("active",m==="signup");
  $("nameField").classList.toggle("hidden",m!=="signup");
  $("usernameField").classList.toggle("hidden",m!=="signup");
  $("authSubmit").textContent=m==="login"?"Kirish":"Hisob yaratish";
  $("authForm").dataset.mode=m;
}
async function getProfile(id){
  const r=await db.from("profiles").select("*").eq("id",id).maybeSingle();
  if(r.error)throw r.error;return r.data;
}
function avatar(p){
  return p?.avatar_url
    ?`<img class="avatar" src="${esc(p.avatar_url)}" alt="">`
    :`<div class="avatar" style="display:grid;place-items:center">${initials(p?.display_name||p?.username)}</div>`;
}
async function createProfile(user,username,name){
  const r=await db.from("profiles").insert({
    id:user.id,username,display_name:name||username
  }).select().single();
  if(r.error)throw r.error;return r.data;
}

$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const mode=$("authForm").dataset.mode||"login";
 const email=$("email").value.trim(),password=$("password").value;
 $("authSubmit").disabled=true;
 try{
  if(mode==="signup"){
   const username=$("username").value.trim().replace(/^@/,"").toLowerCase();
   const name=$("displayName").value.trim()||username;
   if(!/^[a-z0-9_]{3,24}$/.test(username))throw Error("Username 3–24 ta belgi bo‘lsin.");
   const result=await db.auth.signUp({email,password});
   if(result.error)throw result.error;
   if(!result.data.session){
    toast("Emailni tasdiqlang, keyin tizimga kiring.");setMode("login");return;
   }
   await createProfile(result.data.user,username,name);
  }else{
   const r=await db.auth.signInWithPassword({email,password});
   if(r.error)throw r.error;
  }
  await boot();
 }catch(err){toast(err.message||"Xatolik yuz berdi");}
 finally{$("authSubmit").disabled=false;}
});

async function boot(){
 const r=await db.auth.getUser(),user=r.data.user;
 if(!user){showAuth();return;}
 currentUser=user;
 try{
  profile=await getProfile(user.id);
  if(!profile){
   let u=(user.email||"user").split("@")[0].replace(/[^a-z0-9_]/gi,"").toLowerCase();
   if(u.length<3)u="user_"+user.id.slice(0,8);
   profile=await createProfile(user,u,u);
  }
  $("auth").classList.add("hidden");$("app").classList.remove("hidden");
  $("myName").textContent=profile.display_name;
  $("myUsername").textContent="@"+profile.username;
  $("myAvatar").src=profile.avatar_url||"";
  await refreshAll();
  clearInterval(timer);timer=setInterval(()=>refreshAll(true),7000);
 }catch(err){toast("Profil xatosi: "+err.message);}
}
function showAuth(){
 currentUser=null;profile=null;activeChat=null;partner=null;
 clearInterval(timer);$("app").classList.add("hidden");$("auth").classList.remove("hidden");
}
async function logout(){await db.auth.signOut();showAuth();}
db.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT")showAuth();});

async function uploadFile(bucket,file){
 if(!file)throw Error("Fayl tanlang.");
 if(file.size>8*1024*1024)throw Error("Fayl 8 MB dan kichik bo‘lsin.");
 const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
 const path=`${currentUser.id}/${crypto.randomUUID()}.${ext}`;
 const r=await db.storage.from(bucket).upload(path,file,{contentType:file.type||"application/octet-stream"});
 if(r.error)throw r.error;
 return db.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}
async function uploadAvatar(){
 try{
  const file=$("avatarFile").files[0];
  if(!file||!file.type.startsWith("image/"))throw Error("Rasm tanlang.");
  const url=await uploadFile("avatars",file);
  const r=await db.from("profiles").update({avatar_url:url}).eq("id",currentUser.id);
  if(r.error)throw r.error;
  profile=await getProfile(currentUser.id);$("myAvatar").src=url;
  toast("Profil rasmi saqlandi.");
 }catch(e){toast(e.message);}
}
async function editProfile(){
 const name=prompt("Ismingiz:",profile.display_name);if(name===null)return;
 const username=prompt("Username:",profile.username);if(username===null)return;
 const u=username.trim().replace(/^@/,"").toLowerCase();
 if(!/^[a-z0-9_]{3,24}$/.test(u)){toast("Username noto‘g‘ri.");return;}
 try{
  const r=await db.from("profiles").update({display_name:name.trim().slice(0,40)||u,username:u}).eq("id",currentUser.id);
  if(r.error)throw r.error;
  profile=await getProfile(currentUser.id);
  $("myName").textContent=profile.display_name;$("myUsername").textContent="@"+profile.username;
  toast("Profil yangilandi.");
 }catch(e){toast(e.message);}
}
async function searchUsers(){
 const q=$("searchInput").value.trim().replace(/^@/,"").toLowerCase();
 if(!q){$("searchResults").innerHTML="";return;}
 try{
  const r=await db.from("profiles").select("*").ilike("username",q).neq("id",currentUser.id).limit(20);
  if(r.error)throw r.error;
  $("searchResults").innerHTML=r.data.length?r.data.map(p=>`
   <div class="useritem">${avatar(p)}
    <div style="flex:1;min-width:0"><b>${esc(p.display_name)}</b><div class="muted">@${esc(p.username)}</div></div>
    <button class="smallbtn" data-open="${p.id}">Chat</button></div>`).join(""):"<p class='muted'>Topilmadi.</p>";
  $("searchResults").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openChat(b.dataset.open));
 }catch(e){toast(e.message);}
}
$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();searchUsers();}});

async function openChat(id){
 try{
  const p=await getProfile(id);if(!p)throw Error("Profil topilmadi.");
  const [a,b]=[currentUser.id,id].sort();
  let r=await db.from("chats").select("*").eq("member_a",a).eq("member_b",b).maybeSingle();
  if(r.error)throw r.error;
  let chat=r.data;
  if(!chat){
   const created=await db.from("chats").insert({member_a:a,member_b:b}).select().single();
   if(created.error){
    const again=await db.from("chats").select("*").eq("member_a",a).eq("member_b",b).single();
    if(again.error)throw created.error;chat=again.data;
   }else chat=created.data;
  }
  activeChat=chat;partner=p;
  $("chatTitle").textContent=p.display_name;$("chatSub").textContent="@"+p.username;
  $("composer").classList.remove("hidden");
  await renderMessages();await loadChats();
 }catch(e){toast(e.message);}
}
async function renderMessages(){
 if(!activeChat)return;
 const r=await db.from("messages").select("*").eq("chat_id",activeChat.id).order("created_at").limit(200);
 if(r.error)throw r.error;
 $("content").innerHTML=`<div class="messages">${r.data.map(m=>`
 <div class="bubble ${m.sender_id===currentUser.id?"mine":""}">${esc(m.body)}
 <time>${new Date(m.created_at).toLocaleString()}</time></div>`).join("")}</div>`;
 $("content").scrollTop=$("content").scrollHeight;
}
$("composer").addEventListener("submit",async e=>{
 e.preventDefault();if(!activeChat)return;
 const body=$("messageInput").value.trim();if(!body)return;
 $("messageInput").value="";
 const r=await db.from("messages").insert({chat_id:activeChat.id,sender_id:currentUser.id,body});
 if(r.error){toast(r.error.message);return;}
 try{await renderMessages();await loadChats();}catch(e){toast(e.message);}
});
async function loadChats(){
 const r=await db.from("chats").select("*")
 .or(`member_a.eq.${currentUser.id},member_b.eq.${currentUser.id}`)
 .order("created_at",{ascending:false}).limit(50);
 if(r.error)throw r.error;
 if(!r.data.length){$("chatList").innerHTML="<p class='muted'>Suhbatlar hali yo‘q.</p>";return;}
 const ids=[...new Set(r.data.map(c=>c.member_a===currentUser.id?c.member_b:c.member_a))];
 const pr=await db.from("profiles").select("*").in("id",ids);
 if(pr.error)throw pr.error;
 const map=new Map(pr.data.map(p=>[p.id,p]));
 $("chatList").innerHTML=r.data.map(c=>{
  const id=c.member_a===currentUser.id?c.member_b:c.member_a,p=map.get(id);
  if(!p)return "";
  return `<div class="useritem ${activeChat?.id===c.id?"selected":""}" data-chat="${id}">
   ${avatar(p)}<div><b>${esc(p.display_name)}</b><div class="muted">@${esc(p.username)}</div></div></div>`;
 }).join("");
 $("chatList").querySelectorAll("[data-chat]").forEach(el=>el.onclick=()=>openChat(el.dataset.chat));
}
async function uploadStory(){
 try{
  const file=$("storyFile").files[0];
  if(!file||(!file.type.startsWith("image/")&&!file.type.startsWith("video/")))throw Error("Rasm yoki video tanlang.");
  const url=await uploadFile("stories",file);
  const r=await db.from("stories").insert({
   user_id:currentUser.id,media_url:url,
   media_type:file.type.startsWith("video/")?"video":"image",
   expires_at:new Date(Date.now()+86400000).toISOString()
  });
  if(r.error)throw r.error;
  $("storyFile").value="";toast("Story joylandi.");await loadStories();
 }catch(e){toast(e.message);}
}
async function loadStories(){
 const r=await db.from("stories").select("*").gt("expires_at",new Date().toISOString()).order("created_at",{ascending:false}).limit(100);
 if(r.error)throw r.error;
 const ids=[...new Set(r.data.map(s=>s.user_id))];
 let profiles=[];
 if(ids.length){
  const p=await db.from("profiles").select("*").in("id",ids);
  if(p.error)throw p.error;profiles=p.data;
 }
 const map=new Map(profiles.map(p=>[p.id,p]));
 $("stories").innerHTML=r.data.map(s=>{
  const p=map.get(s.user_id);if(!p)return "";
  return `<div class="story" data-story="${s.id}">${avatar(p)}<small>${esc(p.username)}</small></div>`;
 }).join("")||"<span class='muted'>Hali story yo‘q.</span>";
 $("stories").querySelectorAll("[data-story]").forEach(el=>el.onclick=()=>viewStory(el.dataset.story));
}
async function viewStory(id){
 try{
  const r=await db.from("stories").select("*").eq("id",id).gt("expires_at",new Date().toISOString()).single();
  if(r.error)throw r.error;
  const p=await getProfile(r.data.user_id);
  $("storyTitle").textContent=p?.display_name||"Story";
  $("storyOwner").textContent="@"+(p?.username||"");
  $("storyMedia").innerHTML=r.data.media_type==="video"
   ?`<video src="${esc(r.data.media_url)}" controls autoplay playsinline></video>`
   :`<img src="${esc(r.data.media_url)}" alt="Story">`;
  $("storyViewer").classList.remove("hidden");
 }catch(e){toast("Story topilmadi yoki muddati tugagan.");}
}
function closeStory(){$("storyViewer").classList.add("hidden");$("storyMedia").innerHTML="";}
$("storyViewer").addEventListener("click",e=>{if(e.target===$("storyViewer"))closeStory();});
async function refreshAll(silent=false){
 if(!currentUser)return;
 try{await Promise.all([loadStories(),loadChats()]);if(activeChat)await renderMessages();}
 catch(e){if(!silent)toast(e.message);}
}
setMode("login");
boot();
</script>
</body>
</html>
